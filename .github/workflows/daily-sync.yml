name: Daily Job Sync

"on":
  schedule:
    - cron: "0 6 * * *"  # 6:00 AM UTC = 12:00 PM (Noon) Bangladesh Time
  workflow_dispatch:      # Allows manual trigger via "Run workflow" button

permissions:
  contents: read
  issues: write           # Required to create failure issue notification

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required repository secrets
        run: |
          missing=0
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::Missing secret: SUPABASE_URL"
            missing=1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Missing secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi
          if [ $missing -eq 1 ]; then
            echo ""
            echo "═════════════════════════════════════════════════════════════════"
            echo "CRITICAL: Required Supabase secrets are not configured!"
            echo "Go to GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "Add 'SUPABASE_URL' and 'SUPABASE_SERVICE_ROLE_KEY'."
            echo "═════════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "Supabase secrets verified successfully."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Run database cleanup
        run: |
          cd backend
          export PYTHONPATH=.
          echo "Running cleanup for stale non-engineering jobs..."
          python -m app.scripts.cleanup_jobs || echo "Cleanup completed with minor non-fatal warnings."

      - name: Run multi-source job ingestion
        id: sync
        run: |
          cd backend
          export PYTHONPATH=.
          python -c "
          import asyncio
          import json
          import os
          from app.services.job_scraper import sync_jobs

          result = asyncio.run(sync_jobs())
          print('Ingestion Result:', json.dumps(result, indent=2))

          # Write markdown summary to GitHub Actions summary tab
          summary_file = os.getenv('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a', encoding='utf-8') as f:
                  f.write('## 🚀 সম্ভব (Shomvob) — Job Sync Summary\n\n')
                  f.write(f'**Status:** {result.get(\"status\", \"unknown\")}\n')
                  f.write(f'**Total Jobs Fetched:** {result.get(\"fetched\", 0)}\n')
                  f.write(f'**Jobs Upserted / Updated:** {result.get(\"inserted\", 0)}\n\n')
                  f.write('### Source Breakdown\n\n')
                  f.write('| Platform / Source | Jobs Ingested |\n')
                  f.write('| :--- | :--- |\n')
                  for src, count in sorted(result.get('sources', {}).items()):
                      f.write(f'| {src} | {count} |\n')
          "

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Daily Job Sync Failed - ' + new Date().toISOString().split('T')[0],
                body: `### Daily Job Sync Failed\n\nThe GitHub Actions workflow **Daily Job Sync** encountered an error during execution.\n\n- **Run ID:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- **Date:** ${new Date().toUTCString()}\n\nPlease check the workflow run logs to diagnose the issue.`,
              });
              console.log('Failure issue created successfully.');
            } catch (err) {
              console.warn('Could not create GitHub issue (check repository token permissions):', err.message);
            }
